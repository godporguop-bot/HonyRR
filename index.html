<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เกมเป่ายิ้งฉุบ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      background: linear-gradient(to bottom,#fff,#f3f6fa);
    }
    .choice-btn{width:120px;height:120px;border-radius:12px;}
    .choice-icon{font-size:2rem;display:block}
    .pulse{animation:pulse .3s ease}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h3 class="mb-3">เกมเป่ายิ้งฉุบ</h3>

          <!-- คะแนน -->
          <div class="row mb-3">
            <div class="col">
              <h5>ผู้เล่น</h5>
              <div id="playerChoice">-</div>
              <h2 id="playerPoint">0</h2>
            </div>
            <div class="col">
              <h5>คอมพิวเตอร์</h5>
              <div id="cpuChoice">-</div>
              <h2 id="cpuPoint">0</h2>
            </div>
          </div>

          <!-- ข้อความแจ้งผล -->
          <div id="message" class="fw-semibold mb-2">เลือกหิน กระดาษ หรือกรรไกร</div>

          <!-- ปุ่มกด -->
          <div class="d-flex justify-content-center gap-3 flex-wrap mb-3">
            <button class="btn btn-light choice-btn" data-choice="rock"><span class="choice-icon">✊</span> หิน</button>
            <button class="btn btn-light choice-btn" data-choice="paper"><span class="choice-icon">✋</span> กระดาษ</button>
            <button class="btn btn-light choice-btn" data-choice="scissors"><span class="choice-icon">✌️</span> กรรไกร</button>
          </div>

          <div class="mb-2">รอบที่ <span id="roundNum">0</span></div>
          <div><span id="lastResult" class="badge bg-secondary">ยังไม่มีผล</span></div>

          <!-- ตั้งค่า -->
          <div class="mt-3">
            <label>ชนะถึง:</label>
            <select id="targetScore" class="form-select form-select-sm d-inline-block w-auto">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="7">7</option>
            </select>
            <button id="resetBtn" class="btn btn-outline-secondary btn-sm ms-2">รีเซ็ต</button>
          </div>
        </div>
      </div>
      <footer class="text-center small text-muted mt-3">เขียนเล่นๆ ขำๆ 😁</footer>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  // ค่าที่ใช้ในเกม
  const choices = ['rock','paper','scissors'];
  const icons = {rock:'✊', paper:'✋', scissors:'✌️'};

  let playerPoint=0, computerPoint=0, round=0;

  // อ้างอิง element
  const playerChoiceEl = document.getElementById('playerChoice');
  const cpuChoiceEl = document.getElementById('cpuChoice');
  const playerPointEl = document.getElementById('playerPoint');
  const cpuPointEl = document.getElementById('cpuPoint');
  const msgEl = document.getElementById('message');
  const lastResult = document.getElementById('lastResult');
  const roundNum = document.getElementById('roundNum');
  const targetSel = document.getElementById('targetScore');

  // ให้คอมสุ่ม
  function cpuPick(){
    return choices[Math.floor(Math.random()*3)];
  }

  // เช็คผลการแข่ง
  function checkWin(player,cpu){
    if(player===cpu) return 'draw';
    if((player==='rock'&&cpu==='scissors')||(player==='scissors'&&cpu==='paper')||(player==='paper'&&cpu==='rock')){
      return 'win';
    }
    return 'lose';
  }

  // อัปเดตคะแนน
  function updateUI(){
    playerPointEl.textContent=playerPoint;
    cpuPointEl.textContent=computerPoint;
    roundNum.textContent=round;
  }

  // เล่น 1 รอบ
  function playRound(playerPick){
    let target = parseInt(targetSel.value);
    if(playerPoint>=target||computerPoint>=target){
      msgEl.textContent = "เกมจบแล้ว กดรีเซ็ตเพื่อเริ่มใหม่";
      return;
    }

    const cpuPickResult = cpuPick();
    round++;
    playerChoiceEl.textContent = icons[playerPick]+" "+playerPick;
    cpuChoiceEl.textContent = icons[cpuPickResult]+" "+cpuPickResult;

    let result = checkWin(playerPick,cpuPickResult);

    if(result==='win'){
      playerPoint++;
      lastResult.textContent="คุณชนะ!";
      lastResult.className="badge bg-success pulse";
    }else if(result==='lose'){
      computerPoint++;
      lastResult.textContent="คอมชนะ!";
      lastResult.className="badge bg-danger pulse";
    }else{
      lastResult.textContent="เสมอ";
      lastResult.className="badge bg-secondary pulse";
    }

    updateUI();

    if(playerPoint>=target||computerPoint>=target){
      msgEl.textContent = (playerPoint>computerPoint)?"คุณเป็นผู้ชนะ":"คอมชนะเกมนี้";
    }else{
      msgEl.textContent = "เลือกใหม่ได้เลย";
    }
  }

  // event listener
  document.querySelectorAll('[data-choice]').forEach(btn=>{
    btn.onclick=()=>playRound(btn.getAttribute('data-choice'));
  });

  document.getElementById('resetBtn').onclick=()=>{
    playerPoint=0; computerPoint=0; round=0;
    playerChoiceEl.textContent='-'; cpuChoiceEl.textContent='-';
    msgEl.textContent="เลือกหิน กระดาษ หรือกรรไกร";
    lastResult.textContent="ยังไม่มีผล";
    lastResult.className="badge bg-secondary";
    updateUI();
  };

  updateUI();
})();
</script>
</body>
</html>
